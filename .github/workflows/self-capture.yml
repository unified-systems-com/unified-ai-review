# Unified AI Review self-shim — stage 1 (UNPRIVILEGED capture).
# The review system reviews itself (TAP req-cicd-ai-review-harness-repo-5): this repo
# is an ordinary consumer of its own machinery, pinned by full commit SHA like every
# other consumer. Safe against self-reference by design: `workflow_run` executes the
# DEFAULT-BRANCH definition, so a PR that edits the machinery is reviewed by the
# trusted current version, never by itself.
name: AI review capture

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  capture:
    permissions:
      contents: read
    uses: unified-systems-com/unified-ai-review/.github/workflows/capture.yml@83c0d1dd3c8221c95ebf4707a0b0cf4a26ecf08f # main 2026-08-20
