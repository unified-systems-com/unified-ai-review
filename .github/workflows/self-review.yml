# Unified AI Review self-shim — stage 2 (PRIVILEGED review).
# The review system reviews itself (TAP req-cicd-ai-review-harness-repo-5). Runs the
# base-branch definition in base-repo context with the vendor keys; the machinery never
# checks out or executes PR content — the diff arrives as data. A PR editing this
# machinery is therefore reviewed by the trusted default-branch version of it, and the
# seats already treat review-path edits as findings in their own right.
# Machinery AND prompts pinned by full commit SHA (both pins are reviewer
# configuration: editing this file is a finding in its own right).
name: AI review

on:
  workflow_run:
    workflows: ["AI review capture"]
    types: [completed]

concurrency:
  group: ai-review-run-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: unified-systems-com/unified-ai-review/.github/workflows/review.yml@83c0d1dd3c8221c95ebf4707a0b0cf4a26ecf08f # main 2026-08-20
    with:
      prompts-repo: unified-systems-com/unified-ai-review-prompts
      prompts-ref: fcdba2b1ce8ebfb3ced0b30668da17d58cefb240 # main 2026-08-20 — security pack v1
      prompt-pack: security
      # gpt-5.6-sol: pinned EXPLICITLY, not via alias — see the tap shim for the history.
      openai-model: gpt-5.6-sol
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
