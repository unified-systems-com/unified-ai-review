# Unified AI Review — stage 1: capture (UNPRIVILEGED).
#
# Called from a consumer's `pull_request` shim. Runs in the fork-PR context with no
# secrets and no write permissions. Its ONLY job: compute the PR's diff and publish it
# as an artifact — data crossing the privilege boundary, never code.
#
# Security contract (spec: TAP req-cicd-ai-review-ensemble-5):
#   - persist-credentials: false — no git credential remains in the workspace
#   - the merge commit is diffed against its first parent, so the diff is exactly the
#     PR's effect on the current base
#   - the artifact contains ONLY the diff text; PR identity is never read from it —
#     stage 2 re-derives that from its own trusted event context
name: capture

on:
  workflow_call:
    inputs:
      diff-size-cap-kb:
        description: Maximum diff size in KiB. Larger diffs are truncated with a loud marker (truncation is itself review-relevant).
        type: number
        required: false
        default: 1024

jobs:
  capture:
    name: Capture PR diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Compute the diff (merge commit vs its base parent)
        env:
          CAP_KB: ${{ inputs.diff-size-cap-kb }}
        run: |
          set -euo pipefail
          git diff HEAD^1 HEAD > diff.patch
          size=$(wc -c < diff.patch)
          cap=$(( CAP_KB * 1024 ))
          if [ "$size" -gt "$cap" ]; then
            head -c "$cap" diff.patch > diff.capped
            printf '\n\n[unified-ai-review] DIFF TRUNCATED at %sKiB (full size %s bytes). Truncation is review-relevant: the tail of this PR was not seen.\n' "$CAP_KB" "$size" >> diff.capped
            mv diff.capped diff.patch
          fi
          echo "diff bytes: $(wc -c < diff.patch)"

      - name: Upload diff artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unified-ai-review-diff
          path: diff.patch
          retention-days: 14
          if-no-files-found: error
